[project]
name = "orbyte-collective-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "pydantic-settings",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "pyjwt[crypto]>=2.15.1",
  "httpx>=0.28.1",
  "pillow==13.0.0",
  "pypdfium2==5.14.0",
  "python-multipart==0.0.32",
  "google-genai==2.33.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
